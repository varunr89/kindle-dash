# Device config. Fetched by dashboard.sh every cycle and adopted when it changes, so
# changing a value here reaches the panel without touching the device (within the CDN's
# ~5 min). Only DASH_URLS and DASH_INTERVAL are read; the file is never sourced.
DASH_URLS="https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-snow.png https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-status.png https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-bellevue.png https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-menu.png https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-blog.png https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-hn.png https://raw.githubusercontent.com/varunr89/kindle-dash/main/dash-xkcd.png"
DASH_INTERVAL=60
